name: Setup Go + ANTLR4
description: Checkout, set up Go 1.26.4, cache ANTLR4 jar, install tooling, and generate parser.

inputs:
  fetch-depth:
    description: Number of commits to fetch (0 = full history)
    default: '1'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: actions/setup-go@v6
      with:
        go-version: '1.26.4'

    - name: Cache ANTLR4 JAR
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository/org/antlr/antlr4
        key: antlr4-4.13.2

    - name: Install ANTLR4
      run: pip install 'antlr4-tools==0.2.2'
      shell: bash

    - name: Generate parser
      run: make grammar
      shell: bash
      env:
        ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
