name: Release mxcli

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - uses: oven-sh/setup-bun@v2
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'

      - name: Build mxcli binaries
        run: |
          set -e
          make sync-all
          mkdir -p bin
          VERSION="${{ github.ref_name }}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.CommitSHA=${COMMIT_SHA}"
          echo "VERSION=${VERSION} COMMIT_SHA=${COMMIT_SHA}"
          echo "LDFLAGS=${LDFLAGS}"
          for TARGET in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64" "windows/arm64"; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            EXT=""; [ "${OS}" = "windows" ] && EXT=".exe"
            echo "Building ${OS}/${ARCH}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build -ldflags "${LDFLAGS}" -trimpath -o "bin/${BIN}" ./cmd/mxcli 2>&1
            (cd bin && zip -q "${BIN}.zip" "${BIN}" && rm "${BIN}")
          done

      - name: Generate SHA256 checksums
        run: |
          cd bin
          sha256sum mxcli-*.zip > SHA256SUMS

      - name: Generate release notes from CHANGELOG.md
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) { exit }
              gsub(/^## \[|\].*$/, "", $0)
              ver_str = $0
              gsub(/ .*$/, "", ver_str)
              if (ver_str == ver) { found=1; next }
            }
            found { if (/^## \[|^# /) exit; print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for ${TAG}, falling back to git log"
            echo "## What's Changed" > release-notes.md
            git log --oneline "$(git tag --sort=-creatordate | head -2 | tail -1)..HEAD" >> release-notes.md
            echo "" >> release-notes.md
          fi
          echo "" >> release-notes.md
          echo "**Full changelog**: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md)" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            bin/mxcli-linux-amd64.zip
            bin/mxcli-linux-arm64.zip
            bin/mxcli-darwin-amd64.zip
            bin/mxcli-darwin-arm64.zip
            bin/mxcli-windows-amd64.zip
            bin/mxcli-windows-arm64.zip
            bin/SHA256SUMS
            install.sh
            install.ps1
