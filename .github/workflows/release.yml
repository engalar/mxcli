name: Release mxcli

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'

      - name: Build mxcli binaries
        run: |
          set -e
          make sync-all
          mkdir -p bin
          VERSION="${{ github.ref_name }}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.CommitSHA=${COMMIT_SHA}"
          echo "VERSION=${VERSION} COMMIT_SHA=${COMMIT_SHA}"
          echo "LDFLAGS=${LDFLAGS}"
          for TARGET in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64" "windows/arm64"; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            EXT=""; [ "${OS}" = "windows" ] && EXT=".exe"
            echo "Building ${OS}/${ARCH}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" go build -ldflags "${LDFLAGS}" -trimpath -o "bin/mxcli-${OS}-${ARCH}${EXT}" ./cmd/mxcli 2>&1
          done

      - name: Generate SHA256 checksums
        run: |
          cd bin
          sha256sum mxcli-linux-amd64 mxcli-linux-arm64 \
                    mxcli-darwin-amd64 mxcli-darwin-arm64 \
                    mxcli-windows-amd64.exe mxcli-windows-arm64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag-pattern '^v[0-9]' --strip header --tag '${{ github.ref_name }}'
        env:
          OUTPUT: release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            bin/mxcli-linux-amd64
            bin/mxcli-linux-arm64
            bin/mxcli-darwin-amd64
            bin/mxcli-darwin-arm64
            bin/mxcli-windows-amd64.exe
            bin/mxcli-windows-arm64.exe
            bin/SHA256SUMS
            install.sh
            install.ps1
