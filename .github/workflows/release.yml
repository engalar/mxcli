name: Release mxcli

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'

      - name: Sync assets and build mxcli binaries
        run: |
          set -e
          make sync-all
          mkdir -p bin
          LDFLAGS='-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ") -X main.CommitSHA=$(git rev-parse HEAD)'
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -trimpath -o bin/mxcli-linux-amd64   ./cmd/mxcli
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "$LDFLAGS" -trimpath -o bin/mxcli-linux-arm64   ./cmd/mxcli
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags "$LDFLAGS" -trimpath -o bin/mxcli-darwin-amd64  ./cmd/mxcli
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "$LDFLAGS" -trimpath -o bin/mxcli-darwin-arm64  ./cmd/mxcli
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -trimpath -o bin/mxcli-windows-amd64.exe ./cmd/mxcli
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -trimpath -o bin/mxcli-windows-arm64.exe ./cmd/mxcli

      - name: Generate SHA256 checksums
        run: |
          cd bin
          sha256sum mxcli-linux-amd64 mxcli-linux-arm64 \
                    mxcli-darwin-amd64 mxcli-darwin-arm64 \
                    mxcli-windows-amd64.exe mxcli-windows-arm64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag-pattern '^v[0-9]' --strip header --tag '${{ github.ref_name }}'
        env:
          OUTPUT: release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            bin/mxcli-linux-amd64
            bin/mxcli-linux-arm64
            bin/mxcli-darwin-amd64
            bin/mxcli-darwin-arm64
            bin/mxcli-windows-amd64.exe
            bin/mxcli-windows-arm64.exe
            bin/SHA256SUMS
            install.sh
            install.ps1
