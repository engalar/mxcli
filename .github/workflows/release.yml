name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Cache ANTLR4 JAR
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/antlr/antlr4
          key: antlr4-4.13.2
      - name: Install ANTLR4
        run: pip install 'antlr4-tools==0.2.2'
      - name: Generate parser
        run: make grammar
        env:
          ANTLR4_TOOLS_ANTLR_VERSION: '4.13.2'
      - name: Build release binaries
        run: make release
      - name: Generate SHA256SUMS
        working-directory: bin
        run: |
          shopt -s nullglob
          files=( mxcli-linux-* mxcli-darwin-* mxcli-windows-*.exe \
                  mxcli-daemon-*.tar.zst mxcli-daemon-*.zip )
          # Skip raw daemon binaries — only the compressed artifacts ship.
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
        shell: bash
      - name: Stage install scripts
        run: cp install.sh install.ps1 bin/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            bin/mxcli-linux-amd64
            bin/mxcli-linux-arm64
            bin/mxcli-darwin-amd64
            bin/mxcli-darwin-arm64
            bin/mxcli-windows-amd64.exe
            bin/mxcli-windows-arm64.exe
            bin/mxcli-daemon-linux-amd64.tar.zst
            bin/mxcli-daemon-linux-arm64.tar.zst
            bin/mxcli-daemon-darwin-amd64.tar.zst
            bin/mxcli-daemon-darwin-arm64.tar.zst
            bin/mxcli-daemon-windows-amd64.exe.zip
            bin/mxcli-daemon-windows-arm64.exe.zip
            bin/SHA256SUMS
            bin/install.sh
            bin/install.ps1
